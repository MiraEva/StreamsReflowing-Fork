# Shader compatibility (Iris / OptiFine).
#
# Shader packs apply their water effects (reflections, caustics, waves) to blocks whose shader render ID matches
# vanilla water's. That ID comes from the active pack's block.properties, which lists minecraft:water -- a modded
# fluid block isn't in it, so it renders as flat, unshaded water. Mods ship their OWN shaders/block.properties (which
# the loader merges in) to map their blocks onto the same ID. Block ID 8 is the conventional water render ID used by
# shader packs (the same one the original Streams mod used), so this makes our directional stream fluid get the full
# water treatment without the user editing their shader pack.
block.8=streamsreflowing:stream
